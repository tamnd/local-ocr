# The shortlist, as serving configuration.
#
# §02 of the spec picks four models and then says the survey has a shelf life
# measured in weeks. This file is what makes that true rather than a hope: a
# candidate is a table here with a repository, a pinned revision and the flags
# it is served under, and `local-ocr eval --model <name>` prints the Bourbaki
# numbers for it. Adding one is an entry, not a patch.
#
# Every revision is pinned. A model repository is a moving branch and a reading
# is only comparable to another reading of the same weights, so a report that
# names `reader-a` and no revision is a report about nothing in particular.
#
# The flags are §01's starting configuration and are not conclusions. The
# benchmark sweeps max_num_seqs and the cache dtype and reports accepted pages
# an hour, and whatever wins is edited here.
#
# One note on --gpu-memory-utilization, because the numbers below do not add to
# one and are not meant to. Reader A's 0.86 is its share with the card to
# itself, which is what M1 and the M4 bake off give it. B and C carry the share
# they take sitting beside something larger, because that is the job they are
# for. M6 runs two at once and lowers A's entry to suit, and that is an edit to
# this file rather than a flag hidden somewhere else.
#
# The revisions are the ones on the hub in August 2026, taken from the API
# rather than from a model card. Two of them are worth knowing about. dots.ocr
# moved from rednote-hilab to dots-studio, and MinerU2.5's card says AGPL-3.0
# where the survey expected an Apache based licence. Both are reasons to write
# down what was actually served.

[reader-a]
repo = "allenai/olmOCR-2-7B-1025-FP8"
revision = "40bd7202494b8264ee17ada08b401b5aab7a9ce1"
port = 8801
what = """
Reader A, the default. Qwen2.5-VL-7B trained with verifiable unit test rewards,
whose authors report the largest gains in formulas, tables and multi column
layout, which are the three places this corpus is hardest. FP8 weights, about
8.5 GB, so a referee still fits beside it on 24 GB.
"""
# --max-model-len 16384: a 300 dpi Bourbaki page is 1831 by 2776, which is a
#   large number of vision tokens before a word is generated, and a dense page
#   answers in 1500 to 3000. This holds the 1400 token prompt, the image and a
#   long answer without paying for context nothing uses.
# --limit-mm-per-prompt {"image": 1}: one page per request, always. The queue, the
#   acceptance rules and the page file are all per page, and two pages in one
#   prompt would let a single bad answer poison both.
# --gpu-memory-utilization 0.86 rather than 0.9: the vision encoder's
#   activations are not in vLLM's KV budget and a full page is a large one.
#   0.9 has been reported to trim outputs under load, and a trimmed page fails
#   the short rule and is read again, so the aggressive setting costs
#   throughput rather than gaining it.
# No --kv-cache-dtype fp8_e4m3, which §01 started with and which had to go. On
#   this card, with these weights and FlashInfer on sm89, it does not degrade the
#   reading a little, it destroys it: the first page ever put through this server
#   came back as "Cor. 82. The. 81. Example. 28). Assertion (i." and then
#   "2.5.1.1." repeated until it hit the token limit, four thousand tokens of it,
#   at temperature zero. The same page on the same server with the flag removed
#   came back correct, in 793 tokens, matching the publisher's own text layer
#   almost word for word. An FP8 model does not imply an FP8 KV cache.
args = [
  "--max-model-len", "16384",
  "--max-num-seqs", "16",
  "--limit-mm-per-prompt", '{"image": 1}',
  "--gpu-memory-utilization", "0.86",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
]

[reader-b]
repo = "opendatalab/MinerU2.5-2509-1.2B"
revision = "1aa090b41282e64fadd79c10572221f91ec21924"
port = 8802
what = """
Reader B, the fast one, and the natural referee. Top of OmniDocBench v1.6 and
the best published formula CDM in the survey at 97.29. 1.2 B, so about 4 GB.
It is architecturally unrelated to a Qwen2.5-VL derivative, which is the point
of running it as the second opinion: two readers that share a base model share
their mistakes. The licence on the card is AGPL-3.0 and not the Apache based
licence the survey expected, which is a reason to keep it as a referee rather
than let it become the default.
"""
args = [
  "--max-model-len", "16384",
  "--max-num-seqs", "16",
  "--limit-mm-per-prompt", '{"image": 1}',
  "--gpu-memory-utilization", "0.30",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
]

[reader-c]
repo = "PaddlePaddle/PaddleOCR-VL"
revision = "7fa00a8c55b735ba51ba49a9058f3f9c57a99a11"
port = 8803
what = """
Reader C, the multilingual one. 0.9 B, Apache-2.0, 109 languages, and a
training set that explicitly included real world maths, synthetic equations,
old fonts and historical documents. The first thing to try on Cyrillic and on
Vietnamese, and the cheapest thing to keep resident.
"""
args = [
  "--max-model-len", "16384",
  "--max-num-seqs", "16",
  "--limit-mm-per-prompt", '{"image": 1}',
  "--gpu-memory-utilization", "0.25",
  "--enable-prefix-caching",
]

[reader-d]
repo = "deepseek-ai/DeepSeek-OCR"
revision = "9f30c71f441d010e5429c532364a86705536c53a"
port = 8804
what = """
Reader D, the cheap one. Optical compression, 64 to 400 vision tokens a page
against several thousand for a 7 B reader, MIT, about 8 GB, and the best blank
page detection in the survey. One independent OmniDocBench run puts it ahead of
olmOCR 2 and blind preference voting puts it behind, which is the disagreement
the bake off exists to settle on Bourbaki pages rather than on invoices.
"""
# --max-model-len 8192 and not 16384 like the rest. This model's config.json
#   gives max_position_embeddings 8192, and vLLM refuses to start above it
#   rather than start and produce nan, which is the right refusal. The optical
#   compression is what makes 8192 enough: a page costs 64 to 400 vision tokens
#   here against several thousand for reader-a, so the window holds the prompt,
#   the page and a long answer with room to spare.
args = [
  "--max-model-len", "8192",
  "--max-num-seqs", "16",
  "--limit-mm-per-prompt", '{"image": 1}',
  "--gpu-memory-utilization", "0.80",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
]

[reader-e]
repo = "dots-studio/dots.ocr"
revision = "c0111ce6bc07803dbc267932ffef0ae3a51dc951"
port = 8805
what = """
Reader E, the multilingual layout one. 3 B, MIT, trained to handle any script,
and reported to beat olmOCR 2 in 55.2 per cent of blind arena matchups. The
repository moved from rednote-hilab to dots-studio, which is one more reason
every entry here carries a revision rather than a branch.
"""
# --trust-remote-code, which none of the others need. vLLM has native support
#   for the rest, and this repository ships its own modelling code that the
#   loader has to import, so without the flag the server will not start at all.
#   The flag means the weights get to run Python on this machine, and the only
#   thing making that a considered risk rather than a shrug is the pinned
#   revision above: it is a fixed tree that can be read, not a branch that can
#   change under a restart.
args = [
  "--trust-remote-code",
  "--max-model-len", "16384",
  "--max-num-seqs", "16",
  "--limit-mm-per-prompt", '{"image": 1}',
  "--gpu-memory-utilization", "0.80",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
]

[reader-a-bf16]
repo = "allenai/olmOCR-2-7B-1025"
revision = "e52d6f090b7a9007afffbbd6ce510876222fea93"
port = 8806
what = """
Reader A at BF16, which is here for one benchmark and not as a candidate. §01
asks what the FP8 weights cost in accuracy, and the only way to answer that is
to read the same 200 pages with the same prompt at BF16. About 15 GB, so it has
the card to itself while it runs.
"""
args = [
  "--max-model-len", "16384",
  "--max-num-seqs", "16",
  "--limit-mm-per-prompt", '{"image": 1}',
  "--gpu-memory-utilization", "0.86",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
]
