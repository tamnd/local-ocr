[project]
name = "local-ocr"
version = "0.1.0"
description = "Page transcription on one GPU, speaking the batch protocol the Bourbaki fleet already uses"
readme = "README.md"
authors = [{ name = "tamnd", email = "1218621+tamnd@users.noreply.github.com" }]
requires-python = ">=3.12"

# Nothing GPU shaped here on purpose. The serving stack is a service with its
# own environment, not a dependency of this package, so the lock resolves on a
# laptop with no CUDA and the evaluation code can be edited and tested there.
dependencies = [
    "httpx>=0.28",
    # Pillow, for one crop. The head pass sends the top strip of a page back to
    # the reader to recover the running head, and the strip has to be cut from
    # the image the fleet sent rather than rendered again. It is a small pure
    # wheel and it does not drag CUDA in behind it, which is the line that
    # matters for what lives in this list.
    "pillow>=11",
]

[project.optional-dependencies]
# The evaluation needs a LaTeX renderer to compute CDM. The batch path on the
# reading machine has no business carrying one.
#
# matplotlib is the renderer: its mathtext engine lays a formula out and says
# where every glyph landed, which is what metrics/cdm.py compares. rapidfuzz is
# the edit distance; without it metrics/cer.py falls back to a pure Python table
# that gives the same answer and takes seconds a page instead of microseconds.
eval = [
    "pillow>=11",
    "matplotlib>=3.9",
    "rapidfuzz>=3.10",
]

[project.scripts]
local-ocr = "local_ocr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    # The eval extra as well, so that CI runs the formula comparison rather than
    # skipping it. A metric nobody exercises is a metric that quietly rots, and
    # these are the numbers the whole project is judged by.
    "matplotlib>=3.9",
    "rapidfuzz>=3.10",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Matched to requires-python, so the fixes ruff applies are ones the minimum
# interpreter can run.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Added to rather than started from everything and suppressed.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001 through RUF003 warn that a string holds a Cyrillic character that looks
# like a Latin one. That is the subject of this module rather than a mistake in
# it: the gate exists to find those characters where they do not belong, and the
# Russian it is tested against is full of them where they do.
"src/local_ocr/russian.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_russian.py" = ["RUF001", "RUF002", "RUF003"]
# The same, for the two places that have to write a Cyrillic range to find one:
# the word pattern that matches a page against a PDF page, and the Russian the
# tests for it are made of.
"src/local_ocr/kvant.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_kvant.py" = ["RUF001", "RUF002", "RUF003"]
# And for the bake off's own tests, where the pages being judged are Russian and
# one of them deliberately carries a Cyrillic es where a Latin c belongs, which
# is the thing the homoglyph gate is there to find.
"tests/test_bakeoff.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a model server, skipped by default",
]
addopts = "-m 'not gpu'"
